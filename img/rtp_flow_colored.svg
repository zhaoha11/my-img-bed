<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <style>
      .title { font: 700 26px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill:#1f2937; }
      .boxText { font: 600 25px "Segoe UI", Arial, sans-serif; fill:#111827; }
      .edgeText { font: 700 22px "Segoe UI", Arial, sans-serif; fill:#1f2937; }
      .caption { font: 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill:#6b7280; }
      .box { stroke:#374151; stroke-width:2.4; rx:6; ry:6; }
      .roundBox { stroke:#374151; stroke-width:2.4; rx:14; ry:14; }
      .network { fill:#ffffff; stroke:#374151; stroke-width:2.4; }
      .arrow { fill:none; stroke:#64748b; stroke-width:4; marker-end:url(#arrow); }
      .arrowBack { fill:none; stroke:#94a3b8; stroke-width:4; marker-end:url(#arrowBack); }
      .thin { stroke-width:3.2; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBack" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">RTP 报文构造和发送流程</text>

  <!-- Top row -->
  <rect x="45" y="95" width="170" height="86" class="box" fill="#dbeafe"/>
  <text x="130" y="147" text-anchor="middle" class="boxText">Encoder</text>

  <rect x="470" y="95" width="250" height="86" class="box" fill="#e0f2fe"/>
  <text x="595" y="147" text-anchor="middle" class="boxText">VideoSendStream</text>

  <rect x="820" y="95" width="230" height="86" class="box" fill="#fef3c7"/>
  <text x="935" y="147" text-anchor="middle" class="boxText">PayloadRouter</text>

  <!-- Middle row -->
  <rect x="50" y="300" width="230" height="86" class="box" fill="#dcfce7"/>
  <text x="165" y="352" text-anchor="middle" class="boxText">RtpSenderVideo</text>

  <rect x="500" y="300" width="195" height="86" class="box" fill="#d1fae5"/>
  <text x="597.5" y="352" text-anchor="middle" class="boxText">RtpSender</text>

  <rect x="820" y="300" width="230" height="86" class="box" fill="#fee2e2"/>
  <text x="935" y="352" text-anchor="middle" class="boxText">ModuleRtpRtcp</text>

  <!-- Lower row -->
  <rect x="45" y="545" width="195" height="86" class="box" fill="#ede9fe"/>
  <text x="142.5" y="597" text-anchor="middle" class="boxText">PacedSender</text>

  <rect x="45" y="705" width="195" height="86" class="box" fill="#f3e8ff"/>
  <text x="142.5" y="757" text-anchor="middle" class="boxText">PacketRouter</text>

  <rect x="320" y="705" width="230" height="86" class="box" fill="#fae8ff"/>
  <text x="435" y="757" text-anchor="middle" class="boxText">ModuleRtpRtcp</text>

  <rect x="620" y="705" width="195" height="86" class="box" fill="#ffedd5"/>
  <text x="717.5" y="757" text-anchor="middle" class="boxText">RtpSender</text>

  <rect x="610" y="500" width="240" height="86" class="roundBox" fill="#ffffff"/>
  <text x="730" y="552" text-anchor="middle" class="boxText">RtpPacketHistory</text>

  <ellipse cx="990" cy="748" rx="85" ry="50" class="network"/>
  <text x="990" y="757" text-anchor="middle" class="boxText">Network</text>

  <!-- Arrows and labels -->
  <path d="M 215 138 L 455 138" class="arrow thin"/>
  <text x="305" y="127" text-anchor="middle" class="edgeText">1 EncodedImage</text>

  <path d="M 720 138 L 805 138" class="arrow thin"/>
  <text x="762" y="127" text-anchor="middle" class="edgeText">2</text>

  <path d="M 935 181 L 935 286" class="arrow thin"/>
  <text x="954" y="245" class="edgeText">3</text>

  <path d="M 820 343 L 710 343" class="arrowBack thin"/>
  <text x="765" y="330" text-anchor="middle" class="edgeText">4</text>

  <path d="M 500 331 L 295 331" class="arrowBack thin"/>
  <text x="397" y="318" text-anchor="middle" class="edgeText">5</text>

  <path d="M 280 358 L 485 358" class="arrow thin"/>
  <text x="384" y="348" text-anchor="middle" class="edgeText">6 RtpPacket</text>

  <path d="M 620 386 L 690 488" class="arrow thin"/>
  <text x="679" y="451" text-anchor="middle" class="edgeText">7 RtpPacket</text>

  <path d="M 510 386 L 125 535" class="arrow thin"/>
  <text x="345" y="465" text-anchor="middle" class="edgeText">8 Packet</text>

  <path d="M 142.5 631 L 142.5 690" class="arrow thin"/>
  <text x="175" y="670" text-anchor="middle" class="edgeText">9 Packet</text>

  <path d="M 240 748 L 305 748" class="arrow thin"/>
  <text x="272" y="737" text-anchor="middle" class="edgeText">10</text>

  <path d="M 550 748 L 605 748" class="arrow thin"/>
  <text x="577" y="737" text-anchor="middle" class="edgeText">11</text>

  <path d="M 685 705 L 685 601" class="arrowBack thin"/>
  <text x="660" y="645" text-anchor="middle" class="edgeText">12</text>

  <path d="M 762 586 L 762 690" class="arrow thin"/>
  <text x="808" y="646" text-anchor="middle" class="edgeText">13 RtpPacket</text>

  <path d="M 815 748 L 890 748" class="arrow thin"/>
  <text x="852" y="737" text-anchor="middle" class="edgeText">14</text>

  <text x="600" y="808" text-anchor="middle" class="caption">图 2 RTP 报文构造和发送</text>
</svg>
